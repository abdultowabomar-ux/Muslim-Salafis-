        function safeMarkdownParse(text) {
            if (!text || text === null || text === undefined) {
                return "";
            }
            try {
                if (typeof marked !== 'undefined' && marked.parse) {
                    return marked.parse(text);
                }
                return text;
            } catch (error) {
                console.error("خطأ في تحويل Markdown:", error);
                return text;
            }
        }

        function formatAIContent(text) {
            const safeText = text || "";
            const htmlContent = safeMarkdownParse(safeText);

        }

// دالة احتياطية للنسخ (للمتصفحات القديمة)
function fallbackCopyToClipboard(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        showNotification("✅ تم نسخ الإجابة بنجاح!");
        console.log("✅ تم نسخ النص باستخدام الطريقة الاحتياطية");
    } catch (err) {
        console.error("❌ فشل النسخ حتى بالطريقة الاحتياطية:", err);
        showNotification("❌ فشل النسخ، حاول مرة أخرى", "error");
    }
    document.body.removeChild(textarea);
}
        // دالة لتنسيق الرد الكامل من JSON (مع الآيات والأحاديث)
function formatFullFatwaResponse(fatwa) {
    let html = `<div class="prose dark:prose-invert max-w-none">`;
    
    // 1. الإجابة الرئيسية
    html += `<div class="answer">${safeMarkdownParse(fatwa.answer || "")}</div>`;
    
    // 2. الأدلة من القرآن
    if (fatwa.quran_evidence && fatwa.quran_evidence.length > 0) {
        html += `<div class="mt-6 p-4 bg-green-900/20 rounded-xl border-r-4 border-green-500">
                    <h3 class="text-green-400 font-bold text-lg mb-3">📖 الأدلة من القرآن الكريم:</h3>
                    <ul class="space-y-2">`;
        for (const q of fatwa.quran_evidence) {
            html += `<li class="mr-4">
                        <span class="text-green-300">«${q.ayah}»</span>
                        <br>
                        <span class="text-white/60 text-sm">سورة ${q.surah} (${q.number})</span>
                    </li>`;
        }
        html += `</ul></div>`;
    }
    
    // 3. الأحاديث النبوية
    if (fatwa.hadith_evidence && fatwa.hadith_evidence.length > 0) {
        html += `<div class="mt-6 p-4 bg-blue-900/20 rounded-xl border-r-4 border-blue-500">
                    <h3 class="text-blue-400 font-bold text-lg mb-3">📚 الأدلة من السنة النبوية:</h3>
                    <ul class="space-y-2">`;
        for (const h of fatwa.hadith_evidence) {
            html += `<li class="mr-4">
                        <span class="text-blue-300">«${h.text}»</span>
                        <br>
                        <span class="text-white/60 text-sm">${h.source} - ${h.grade || ""}</span>
                    </li>`;
        }
        html += `</ul></div>`;
    }
    
    // 4. أقوال العلماء
    if (fatwa.scholars_statements && fatwa.scholars_statements.length > 0) {
        html += `<div class="mt-6 p-4 bg-purple-900/20 rounded-xl border-r-4 border-purple-500">
                    <h3 class="text-purple-400 font-bold text-lg mb-3">👨‍🏫 أقوال العلماء:</h3>
                    <ul class="space-y-2">`;
        for (const s of fatwa.scholars_statements) {
            html += `<li class="mr-4">
                        <span class="text-purple-300 font-bold">${s.scholar}:</span>
                        <span class="text-white/90"> ${s.quote}</span>
                        <br>
                        <span class="text-white/50 text-sm">المصدر: ${s.source}</span>
                    </li>`;
        }
        html += `</ul></div>`;
    }
    
    // 5. المراجع
    if (fatwa.references && fatwa.references.length > 0) {
        html += `<div class="mt-6 p-4 bg-gray-800/50 rounded-xl">
                    <h3 class="text-gray-400 font-bold text-lg mb-3">📌 المراجع والمصادر:</h3>
                    <ul class="list-disc mr-5 space-y-1">`;
        for (const r of fatwa.references) {
            html += `<li class="text-white/70 text-sm">${r}</li>`;
        }
        html += `</ul></div>`;
    }
    
    // 6. أسئلة ذات صلة
    if (fatwa.related_questions && fatwa.related_questions.length > 0) {
        html += `<div class="mt-6 p-4 bg-yellow-900/20 rounded-xl">
                    <h3 class="text-yellow-400 font-bold text-lg mb-3">❓ أسئلة ذات صلة:</h3>
                    <ul class="space-y-1">`;
        for (const q of fatwa.related_questions) {
            const escapedQ = q.replace(/'/g, "\\'");
            html += `<li class="text-yellow-300 text-sm cursor-pointer hover:text-yellow-200" onclick="document.getElementById('message-input').value='${escapedQ}'; handleAsk();">
                        🔹 ${q}
                    </li>`;
        }
        html += `</ul></div>`;
    }
    
    html += `</div>`;
    return html;
}




// دالة خاصة لتأثير الكتابة مع البيانات الكاملة
function startTypewriterForJSON(fullText, messageId, fullFatwaData) {
    if (typeInterval) clearInterval(typeInterval);
    
    state.typingResponse = "";
    let currentIndex = 0;
    
    typeInterval = setInterval(() => {
        if (currentIndex <= fullText.length) {
            state.typingResponse = fullText.slice(0, currentIndex);
            
            const messageDiv = document.querySelector(`.ai-card[data-message-id="${messageId}"]`);
            if (messageDiv) {
                const contentDiv = messageDiv.querySelector('.text-lg');
                if (contentDiv) {
                    // أثناء الكتابة، نعرض النص فقط بدون التنسيق الكامل
                    if (currentIndex < fullText.length) {
                        contentDiv.innerHTML = formatAIContent(state.typingResponse);
                    } else {
                        // بعد الانتهاء، نعرض التنسيق الكامل
                        contentDiv.innerHTML = formatFullFatwaResponse(fullFatwaData);
                    }
                }
            }
            
            const msgIndex = state.messages.findIndex(m => m.id === messageId);
            if (msgIndex !== -1) {
                state.messages[msgIndex].text = state.typingResponse;
            }
            
            scrollToBottom();
            currentIndex++;
        } else {
            clearInterval(typeInterval);
            typeInterval = null;
            
            const msgIndex = state.messages.findIndex(m => m.id === messageId);
            if (msgIndex !== -1) {
                state.messages[msgIndex].isTyping = false;
                state.messages[msgIndex].text = fullText;
                state.messages[msgIndex].fullData = fullFatwaData;
                // حفظ فوري بعد الانتهاء
                saveMessagesToLocal();
            }
        }
    }, 15);
}

        // ==================== Typewriter Effect (FASTER - 15ms instead of 30ms) ====================
        function startTypewriter(text, messageId) {
            if (typeInterval) clearInterval(typeInterval);
            
            state.typingResponse = "";
            let currentIndex = 0;
            
            typeInterval = setInterval(() => {
                if (currentIndex <= text.length) {
                    state.typingResponse = text.slice(0, currentIndex);
                    
                    const messageDiv = document.querySelector(`.ai-card[data-message-id="${messageId}"]`);
                    if (messageDiv) {
                        const contentDiv = messageDiv.querySelector('.text-lg');
                        if (contentDiv) {
                            contentDiv.innerHTML = formatAIContent(state.typingResponse);
                        }
                    }
                    
                    const msgIndex = state.messages.findIndex(m => m.id === messageId);
                    if (msgIndex !== -1) {
                        state.messages[msgIndex].text = state.typingResponse;
                    }
                    
                    // تمرير تلقائي أثناء الكتابة
                    scrollToBottom();
                    
                    currentIndex++;
                } else {
                    clearInterval(typeInterval);
                    typeInterval = null;
                    
                    const msgIndex = state.messages.findIndex(m => m.id === messageId);
                    if (msgIndex !== -1) {
                        state.messages[msgIndex].isTyping = false;
                        // حفظ فوري بعد الانتهاء من الكتابة
                        saveMessagesToLocal();
                    }
                    
                    // حفظ الفتوى في Firebase بعد الانتهاء من الكتابة
                    if (text && text.length > 50) {
                        const originalMessage = state.messages.find(m => m.id === messageId);
                        if (originalMessage && !originalMessage.savedToDB) {
                            originalMessage.savedToDB = true;
                            saveFatwaToDatabase(state.messages[msgIndex - 1]?.text || "", text, false);
                        }
                    }
                }
            }, 15); // أسرع: 15 مللي ثانية بدلاً من 30
        }

                    if (!msg.fullData && msg.text && baseFatwas.length > 0) {

        id: newMessageId,
        savedToDB: true,
        fullData: fullFatwa,  // تخزين البيانات الكاملة للتنسيق
        fullAnswerText: matchedItem.answer  // تخزين النص الكامل للكتابة
    };
    state.messages.push(aiMessage);
    state.loading = false;
    updateMessagesAndRender();
    
    // تشغيل تأثير الكتابة على الرد من JSON
    startTypewriterForJSON(matchedItem.answer, newMessageId, fullFatwa);

                    
                    
                    // إشعار تليجرام للسؤال (حتى لو تم الرد من قاعدة البيانات)
                    await notifyNewQuestion(userText, aiMessage.id);
                } else {
                    const aiResponse = await callGeminiAPI(userText);
                    
                    if (aiResponse) {
                        const newMessageId = (Date.now() + 1).toString();
                        const aiMessage = { 
                            role: 'ai', 
                            text: "", 
                            verified: false, 
                            isTyping: true,
                            id: newMessageId,
                            savedToDB: false
                        };
                        state.messages.push(aiMessage);
                        state.loading = false;
                        updateMessagesAndRender();
                        
                        // إرسال إشعار تليجرام للسؤال الجديد
                        await notifyNewQuestion(userText, newMessageId);
                        
                        // حفظ السؤال في Firebase للمراجعة
                        await saveFatwaToDatabase(userText, "", false);
                        
                        startTypewriter(aiResponse, newMessageId);
                    } else {
                        const errorMessage = "عذراً، حدث خطأ في الاتصال بالذكاء الاصطناعي. يرجى المحاولة مرة أخرى لاحقاً.";
                        const aiMessage = { 
                            role: 'ai', 
                            text: errorMessage, 
                            verified: false, 
                            isTyping: false,
                            id: (Date.now() + 1).toString()
                        };
                        state.messages.push(aiMessage);
                        state.loading = false;
                        updateMessagesAndRender();
                        
                        // حفظ الفتوى الفاشلة للمراجعة
                        await saveFatwaToDatabase(userText, "فشل الاتصال بـ Gemini", false);
                        
                        // إرسال تنبيه لتليجرام
                        const timestamp = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                        const alertMsg = `⚠️ *تنبيه: فشل الاتصال بـ Gemini* \n⏰ الوقت: ${timestamp} \n❓ السؤال: ${userText.substring(0, 200)}`;
                        
                        await sendTelegramNotification(alertMsg, 'Markdown');
                    }
                }
            } catch (error) {
                console.error("خطأ في المعالجة:", error);
                const errorMessage = "عذراً، حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى.";
                state.messages.push({ role: 'ai', text: errorMessage, verified: false, isTyping: false, id: (Date.now() + 1).toString() });
                state.loading = false;
                updateMessagesAndRender();
            }
        }

        // ==================== Menu Toggle ====================
        function toggleMenu() {
            state.isMenuOpen = !state.isMenuOpen;
            const menu = document.getElementById('dropdown-menu');
            if (menu) {
                if (state.isMenuOpen) {
                    menu.classList.remove('menu-hidden');
                    menu.classList.add('menu-visible');
                } else {
                    menu.classList.remove('menu-visible');
                    menu.classList.add('menu-hidden');
                }
            }
        }

        // ==================== Firebase Listener for Real-time Updates ====================
        function setupFirebaseListener() {
            const fatwaRef = db.ref('fatwas');
            fatwaRef.on('child_changed', (snapshot) => {
                const updatedFatwa = snapshot.val();
                const fatwaId = snapshot.key;
                
                if (updatedFatwa.verified) {
                    // تحديث حالة الفتوى في الواجهة إذا كانت موجودة
                    const msgIndex = state.messages.findIndex(m => m.id === fatwaId);
                    if (msgIndex !== -1) {
                        state.messages[msgIndex].verified = true;
                        renderMessages();
                        showNotification("تم اعتماد إجابة هذا السؤال علمياً! ✓");
                    }
                    
                    // تحديث قاعدة بيانات Fuse.js
                    loadSavedFatwas();
                }
            });
        }

        // ==================== Event Listeners Setup ====================
        function setupEventListeners() {
            const textarea = document.getElementById('message-input');
            if (textarea) {
                textarea.addEventListener('input', (e) => {
                    state.input = e.target.value;
                    updateSendButton();
                    e.target.style.height = 'auto';
                    e.target.style.height = e.target.scrollHeight + 'px';
                });
                
                textarea.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleAsk();
                    }
                });
            }
            
            const micBtn = document.getElementById('mic-button');
            if (micBtn) {
                micBtn.addEventListener('click', handleVoiceInput);
            }
            
            const sendBtn = document.getElementById('send-button');
            if (sendBtn) {
                sendBtn.addEventListener('click', handleAsk);
            }
            
            const menuBtn = document.getElementById('menu-button');
            if (menuBtn) {
                menuBtn.addEventListener('click', toggleMenu);
            }
            
            const clearHistoryBtn = document.getElementById('clear-history-btn');
            if (clearHistoryBtn) {
                clearHistoryBtn.addEventListener('click', clearHistory);
            }
            
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('dropdown-menu');
                const menuBtn = document.getElementById('menu-button');
                if (state.isMenuOpen && menu && menuBtn && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                    toggleMenu();
                }
            });
            
            setupScrollHandling();
        }

        // ==================== Service Worker ====================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!'))
                    .catch(err => console.log('Service Worker Failed', err));
            });
        }
